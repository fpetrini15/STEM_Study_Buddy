name: Deploy to Bluehost

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-bluehost
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTP user already lands in public_html.
          server-dir: ./
          # Explicit FTPS (TLS on port 21). If this fails, try: ftps-legacy
          protocol: ftps
          port: 21
          # exclude also protects remote-only paths from delete/overwrite
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/ci/**
            **/.cursor/**
            **/node_modules/**
            **/README.md
            **/.gitignore
            **/wp-admin/**
            **/wp-includes/**
            **/wp-content/**
            **/wp-*.php
            **/xmlrpc.php
            **/license.txt
            **/readme.html
